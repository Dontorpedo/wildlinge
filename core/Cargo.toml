[package]
name = "wildlinge-core"
version = "0.7.0"
edition = "2021"
description = "Wildlinge artificial life simulation core (WebAssembly and native)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
