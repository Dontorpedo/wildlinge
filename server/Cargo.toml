[package]
name = "wildlinge-server"
version = "0.1.0"
edition = "2021"
description = "Shared persistent Wildlinge world with WebSocket access"
license = "MIT"

[dependencies]
wildlinge-core = { path = "../core" }
serde_json = "1"
tungstenite = "0.26"
flate2 = "1"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
